name: ML Pipeline

on:
  push:
    branches: [ "main" ]

jobs:

  # =========================
  # 1. VALIDATION JOB
  # =========================
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install dvc

      - name: Pull data with DVC
        run: dvc pull

      # ✅ IMPORTANT: force MLflow to use local mlruns
      - name: Train model
        run: |
          export MLFLOW_TRACKING_URI="file:./mlruns"
          python train.py

      # ✅ Save Run ID
      - name: Save Run ID
        run: |
          echo $(cat model_info.txt)
      
      # ✅ Upload model_info.txt
      - name: Upload model info
        uses: actions/upload-artifact@v4
        with:
          name: model_info
          path: model_info.txt

      # ✅ Upload mlruns folder
      - name: Upload mlruns
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns


  # =========================
  # 2. DEPLOY JOB
  # =========================
  deploy:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ✅ Download artifacts
      - name: Download model info
        uses: actions/download-artifact@v4
        with:
          name: model_info

      - name: Download mlruns
        uses: actions/download-artifact@v4
        with:
          name: mlruns

      # ✅ DEBUG (you can remove later)
      - name: Debug mlruns structure
        run: |
          echo "Current directory:"
          pwd
          echo "Listing files:"
          ls -R

      # ✅ IMPORTANT: same tracking URI
      - name: Check threshold
        run: |
          export MLFLOW_TRACKING_URI="file:./mlruns"
          python check_threshold.py

      # ✅ Mock Docker build (only runs if above passes)
      - name: Build Docker Image
        run: |
          echo "Building Docker image for Run ID: $(cat model_info.txt)"